x-app-env: &app-env
  NODE_ENV: production
  PORT: 3000
  HOSTNAME: 0.0.0.0
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
  NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:?NEXT_PUBLIC_BETTER_AUTH_URL is required}
  NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Auth Provider}
  AUTH_MAX_BROWSER_SESSIONS: ${AUTH_MAX_BROWSER_SESSIONS:-5}
  AUTH_ENABLE_HIBP_PASSWORD_CHECKS: ${AUTH_ENABLE_HIBP_PASSWORD_CHECKS:-true}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
  OAUTH_VALID_AUDIENCES: ${OAUTH_VALID_AUDIENCES:-}
  OAUTH_ALLOW_DYNAMIC_CLIENT_REGISTRATION: ${OAUTH_ALLOW_DYNAMIC_CLIENT_REGISTRATION:-false}
  OAUTH_TRUSTED_CLIENT_IDS: ${OAUTH_TRUSTED_CLIENT_IDS:-}
  OAUTH_PAIRWISE_SUBJECT_SECRET: ${OAUTH_PAIRWISE_SUBJECT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  EMAIL_FROM: ${EMAIL_FROM:-Auth Provider <noreply@localhost>}

x-app-build: &app-build
  context: .
  target: runner
  args:
    NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:?NEXT_PUBLIC_BETTER_AUTH_URL is required}
    NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Auth Provider}
    NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}

x-app-service: &app-service
  build: *app-build
  environment: *app-env
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app-service
    command: ["bun", "run", "db:migrate"]
    restart: "no"

  web:
    <<: *app-service
    command: ["bun", "server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
